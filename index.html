  <style>

    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eee5;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,sans-serif}body{padding:0 0 env(safe-area-inset-bottom)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f0bf53;outline-offset:2px}#app{max-width:560px;min-height:100dvh;margin:0 auto;background:var(--cream);position:relative;box-shadow:0 0 44px rgba(30,55,37,.12);overflow:hidden;padding-bottom:86px}.top{background:linear-gradient(145deg,#193d2c,#326849);color:#fff;padding:16px 17px 14px;border-radius:0 0 24px 24px;box-shadow:0 5px 18px rgba(30,67,43,.2)}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:42px;height:42px;border-radius:14px;background:#f5d77b;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 -3px 0 rgba(120,84,28,.13)}.brand h1{margin:0;font-size:20px;letter-spacing:-.5px}.brand small{display:block;color:#d4e6d5;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}.wallet{display:flex;gap:7px}.wallet-pill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 10px;font-size:12px;font-weight:800;white-space:nowrap}.profileline{margin-top:13px;display:flex;align-items:center;gap:11px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f2d89b;font-size:22px;border:2px solid rgba(255,255,255,.6)}.profilemeta{flex:1;min-width:0}.profilemeta strong{display:block;font-size:13px}.profilemeta span{font-size:11px;color:#c6ddc8}.levelinfo{width:100%;margin-top:6px;display:flex;justify-content:space-between;font-size:10px;color:#d5e7d4}.xptrack{height:6px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin-top:4px}.xpfill{height:100%;width:0;background:#f2ca62;border-radius:10px;transition:width .3s}.main{padding:14px 13px 10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}.sectionhead h2{font-size:16px;margin:0;letter-spacing:-.3px}.subtle{font-size:11px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow);margin-bottom:12px}.farm-card{padding:10px;background:linear-gradient(180deg,#dff0d7,#c9e2b9);border:1px solid #b9d3a9;overflow:hidden}.farm-sky{height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 5px;color:#456946;font-size:11px;font-weight:700}.farm-wrap{position:relative;overflow:hidden;min-height:285px;display:flex;align-items:center;justify-content:center}.farm-svg{width:100%;height:auto;max-height:350px;display:block;touch-action:pan-y}.tile{cursor:pointer;transition:filter .12s}.tile:active{filter:brightness(1.12)}.tile polygon{stroke:#5c854a;stroke-width:1}.tile.locked polygon{fill:#8ba17e;stroke:#748b68}.tile.grass .topface{fill:#86b866}.tile.tilled .topface{fill:#986741;stroke:#744a2b}.tile.growing .topface{fill:#9a754b;stroke:#724b30}.tile.selected .topface{stroke:#f0b83e;stroke-width:3}.tile .sideface{fill:#668d4c}.tile .emoji{font-size:21px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.tile .tiny{font-size:8px;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#344b32;stroke-width:2px;stroke-linejoin:round;pointer-events:none}.tile .lockemoji{font-size:14px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.farm-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 5px 1px;color:#41623b;font-size:10px}.farm-foot b{font-size:11px}.toolrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.tool{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 2px 7px;text-align:center;color:var(--ink);font-size:10px;font-weight:750;box-shadow:0 2px 6px rgba(48,67,43,.04)}.tool .ico{display:block;font-size:22px;margin-bottom:3px}.tool.active{background:#e3efd9;border:2px solid #67934e;padding:7px 1px 6px;color:#285239}.hint{background:#eef4e9;border:1px solid #d9e7d0;border-radius:11px;padding:9px 11px;font-size:11px;color:#526a4c;line-height:1.4}.selected-panel{margin-top:10px;padding:11px;border:1px solid #e6e0ce;border-radius:13px;background:#fffdf5;display:flex;align-items:center;gap:10px}.selected-art{width:42px;height:42px;background:#edf2e5;border-radius:12px;display:grid;place-items:center;font-size:24px;flex-shrink:0}.selected-info{flex:1;min-width:0}.selected-info strong{font-size:12px;display:block}.selected-info span{font-size:10px;color:var(--muted);display:block;margin-top:3px}.primary{background:var(--forest2);color:white;border:0;border-radius:11px;padding:10px 13px;font-size:11px;font-weight:800;box-shadow:0 3px 0 #1c4a32}.primary:disabled{opacity:.45;box-shadow:none}.secondary{background:#edf2e8;color:#34563c;border:1px solid #d6e2d0;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:750}.danger{background:#fff0eb;color:#a64c35;border:1px solid #f1d2c7;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.stat{background:#fffdf7;border:1px solid var(--line);border-radius:13px;padding:9px 5px;text-align:center}.stat .sico{font-size:19px}.stat strong{display:block;font-size:14px;margin-top:3px}.stat span{font-size:9px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.tab{background:transparent;border:0;border-radius:12px;padding:8px 2px;color:#738174;font-size:9px;font-weight:750}.tab .ico{display:block;font-size:21px;margin-bottom:3px}.tab.active{background:#e3efdb;color:#315d3d}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);z-index:20;background:rgba(255,253,247,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.bottomnav .tab{font-size:10px}.page-title{font-size:18px;font-weight:900;margin:1px 0 3px}.page-sub{font-size:11px;color:var(--muted);margin-bottom:13px}.crop-list,.item-list{display:grid;gap:9px}.crop-card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fffefa}.crop-art{width:46px;height:46px;flex-shrink:0;background:#edf4e7;border-radius:12px;display:grid;place-items:center;font-size:26px}.crop-meta{flex:1;min-width:0}.crop-meta strong{display:block;font-size:12px}.crop-meta small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.4}.crop-action{border:0;border-radius:9px;background:#2e6848;color:white;padding:8px 10px;font-size:10px;font-weight:850;white-space:nowrap}.crop-action:disabled{background:#d8ddd4;color:#879184}.segmented{display:flex;gap:6px;overflow:auto;margin:10px 0}.segment{white-space:nowrap;border:1px solid var(--line);background:#fffdf8;border-radius:20px;padding:7px 12px;font-size:10px;font-weight:750;color:#667468}.segment.active{background:#e5f0de;border-color:#91b57e;color:#30583a}.progress{height:6px;border-radius:8px;background:#e8ece3;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:#83ad62;border-radius:8px}.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:12px}.empty .big{font-size:35px;margin-bottom:7px}.mission{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fffefa}.mission-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;font-weight:800}.mission small{color:var(--muted);font-size:10px}.badge{font-size:9px;padding:4px 7px;border-radius:20px;background:#edf2e8;color:#56734d;font-weight:800}.badge.done{background:#e4f4df;color:#387344}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.settings-row:last-child{border:0}.toggle{appearance:none;width:40px;height:23px;border-radius:15px;background:#cbd2c8;position:relative;transition:.2s;flex-shrink:0}.toggle:checked{background:#6c9c57}.toggle:before{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:.2s}.toggle:checked:before{left:20px}.toast{position:fixed;left:50%;bottom:83px;transform:translate(-50%,15px);background:#244b35;color:white;border-radius:22px;padding:11px 17px;font-size:11px;font-weight:750;box-shadow:0 6px 22px #152d1d55;opacity:0;pointer-events:none;z-index:50;transition:.25s;white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden}.toast.show{opacity:1;transform:translate(-50%,0)}.modalback{position:fixed;inset:0;background:#13251b88;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(560px,100%);background:#fffdf7;border-radius:22px 22px 16px 16px;padding:18px;box-shadow:0 -5px 30px #0002;max-height:85dvh;overflow:auto}.modal h3{margin:0 0 8px;font-size:17px}.modal p{font-size:12px;color:var(--muted);line-height:1.5}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions>*{flex:1}.tinylabel{font-size:9px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:800}.animal-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:20px;background:#edf3e8;font-size:10px;font-weight:800;margin:3px}.footer-note{font-size:9px;color:#929b8e;text-align:center;padding:10px 0}
    @media(min-width:560px){#app{min-height:100vh}.bottomnav{bottom:0}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div id="app">
 <header class="top">
  <div class="topline"><div class="brand"><div class="brandmark">🌻</div><div><h1>Minha Fazenda</h1><small>seu cantinho no campo</small></div></div><div class="wallet"><div class="wallet-pill">🪙 <span id="coins">650</span></div><div class="wallet-pill">💎 <span id="gems">5</span></div></div></div>
  <div class="profileline"><div class="avatar">🧑‍🌾</div><div class="profilemeta"><strong id="farmName">Fazenda do Demisson</strong><span id="levelName">Nível 1 · Pequeno agricultor</span></div><div style="text-align:right;font-size:10px;color:#d6e8d6">⭐ <b id="levelNum">1</b></div></div>
  <div class="levelinfo"><span>Experiência</span><span id="xpText">0 / 100 XP</span></div><div class="xptrack"><div class="xpfill" id="xpFill"></div></div>
 </header>
 <main class="main" id="main"></main>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
 <nav class="bottomnav" aria-label="Navegação principal">
  <button class="tab active" data-page="farm"><span class="ico">🏡</span>Fazenda</button>
  <button class="tab" data-page="shop"><span class="ico">🏪</span>Loja</button>
  <button class="tab" data-page="storage"><span class="ico">📦</span>Depósito</button>
  <button class="tab" data-page="missions"><span class="ico">📜</span>Missões</button>
  <button class="tab" data-page="more"><span class="ico">☰</span>Mais</button>
 </nav>
</div>
<div id="modalRoot"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const SAVE='minhaFazendaPWA_v1';
const CROPS={wheat:{name:'Trigo',emoji:'🌾',price:10,sell:24,time:5*60*1000,xp:5,level:1,qty:2},carrot:{name:'Cenoura',emoji:'🥕',price:18,sell:42,time:20*60*1000,xp:8,level:1,qty:2},corn:{name:'Milho',emoji:'🌽',price:32,sell:78,time:60*60*1000,xp:13,level:2,qty:2},strawberry:{name:'Morango',emoji:'🍓',price:48,sell:118,time:3*60*60*1000,xp:20,level:3,qty:2},pumpkin:{name:'Abóbora',emoji:'🎃',price:70,sell:175,time:6*60*60*1000,xp:28,level:4,qty:2},sunflower:{name:'Girassol',emoji:'🌻',price:95,sell:240,time:8*60*60*1000,xp:35,level:5,qty:2}};
const ANIMALS={chicken:{name:'Galinha',emoji:'🐔',price:170,product:'Ovos',productEmoji:'🥚',time:2*60*60*1000,sell:35,level:1},cow:{name:'Vaca',emoji:'🐄',price:450,product:'Leite',productEmoji:'🥛',time:4*60*60*1000,sell:85,level:3},sheep:{name:'Ovelha',emoji:'🐑',price:390,product:'Lã',productEmoji:'🧶',time:5*60*60*1000,sell:105,level:4}};
const newState=()=>{const plots=Array.from({length:49},(_,i)=>{const x=i%7,y=Math.floor(i/7),unlocked=x>=1&&x<=5&&y>=1&&y<=5;return{unlocked,state:unlocked?(i%7===2&&y===2?'tilled':'grass'):'locked',crop:null,plantedAt:0}});plots[17].state='tilled';plots[23].state='tilled';plots[24].state='tilled';plots[16]={unlocked:true,state:'growing',crop:'wheat',plantedAt:Date.now()-CROPS.wheat.time+30000};return{coins:650,gems:5,xp:0,level:1,plots,seeds:{wheat:3,carrot:2},produce:{},animals:[],animalProduce:{},decor:[],selectedCrop:'wheat',tool:'select',page:'farm',shopCategory:'seeds',selectedPlot:16,expanded:false,machine:false,autoSell:false,demo:false,muted:false,stats:{planted:0,harvested:0,bought:0,animals:0,visits:0},claimed:[],farmName:'Minha Fazenda',lastVisit:Date.now()}};
let S;try{const raw=localStorage.getItem(SAVE);S=raw?Object.assign(newState(),JSON.parse(raw)):newState();if(!Array.isArray(S.plots)||S.plots.length!==49)S=newState()}catch(e){S=newState()}
let lastReadyCount=0;
let toastTimer;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function save(){S.lastVisit=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador.')}}
function remaining(p){const duration=CROPS[p.crop].time*(S.demo?0.01:1);return Math.max(0,p.plantedAt+duration-Date.now())}function isReady(p){return p.state==='growing'&&remaining(p)<=0}function format(ms){let n=Math.ceil(ms/1000),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}h ${m}m`:`${m}m ${String(s).padStart(2,'0')}s`}
function xp(n){S.xp+=n;let levelled=false;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;S.coins+=100;levelled=true}if(levelled)toast(`🎉 Você chegou ao nível ${S.level}! +100 moedas de presente.`)}
function unlockedCount(){return S.plots.filter(p=>p.unlocked).length}function readyCount(){return S.plots.filter(isReady).length}
function statsHeader(){const levelNames=['Pequeno agricultor','Agricultor aprendiz','Agricultor dedicado','Dono de pomar','Fazendeiro experiente','Mestre do campo','Grande fazendeiro'];$('coins').textContent=S.coins.toLocaleString('pt-BR');$('gems').textContent=S.gems;$('farmName').textContent=S.farmName;$('levelNum').textContent=S.level;$('levelName').textContent=`Nível ${S.level} · ${levelNames[Math.min(S.level-1,levelNames.length-1)]}`;$('xpText').textContent=`${S.xp} / ${S.level*100} XP`;$('xpFill').style.width=`${Math.min(100,S.xp/(S.level*100)*100)}%`}
function plotIcon(p){if(p.state==='locked')return '🔒';if(p.state==='grass')return '';if(p.state==='tilled')return '🟫';if(p.state==='growing'){if(isReady(p))return CROPS[p.crop].emoji;let pct=1-remaining(p)/(CROPS[p.crop].time*((S.demo ? 0.01 : 1)));return pct<.33?'🌱':pct<.75?'🌿':CROPS[p.crop].emoji}return ''}
function drawMap(){const w=350,h=290,cx=175,cy=45,dx=29,dy=16,halfW=29,halfH=15;let pieces=[];for(let y=0;y<7;y++)for(let x=0;x<7;x++){let p=S.plots[y*7+x],px=cx+(x-y)*dx,py=cy+(x+y)*dy;let top=`${px},${py-halfH} ${px+halfW},${py} ${px},${py+halfH} ${px-halfW},${py}`;let side=`${px-halfW},${py} ${px},${py+halfH} ${px+halfW},${py} ${px},${py+halfH+8}`;let cls=p.state+(S.selectedPlot===y*7+x?' selected':'');let ico=plotIcon(p);let txt=p.state==='growing'?(isReady(p)?'PRONTA':format(remaining(p))):p.state==='tilled'?'Preparado':'';let isLocked=p.state==='locked';pieces.push(`<g class="tile ${cls}" data-plot="${y*7+x}"><polygon class="sideface" points="${side}" opacity=".8"/><polygon class="topface" points="${top}"/><text class="${isLocked?'lockemoji':'emoji'}" x="${px}" y="${py-1}">${isLocked?'🔒':ico||''}</text>${txt?`<text class="tiny" x="${px}" y="${py+12}">${txt}</text>`:''}</g>`)}return `<svg class="farm-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Mapa isométrico da sua fazenda"> <defs><linearGradient id="grassbg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#9acb79"/><stop offset="1" stop-color="#72aa5c"/></linearGradient></defs><ellipse cx="175" cy="169" rx="165" ry="102" fill="#77a85c" opacity=".28"/>${pieces.join('')}<g transform="translate(12 255)"><text font-size="13">🌳</text><text x="25" font-size="13">🏡</text><text x="52" font-size="13">🌼</text></g></svg>`}
function toolHint(){return({select:'Toque em um canteiro para ver o que pode fazer.',hoe:'Escolha um terreno livre para preparar a terra.',plant:`Semente selecionada: ${CROPS[S.selectedCrop].name}. Toque em um canteiro preparado.`,harvest:'Toque nas plantações maduras para colher.',water:'Regue uma plantação para adiantar um pouco o crescimento.'})[S.tool]}
function selectedDetail(){let p=S.plots[S.selectedPlot];if(!p)return '';let title,desc,ico,action='';if(p.state==='locked'){title='Terreno bloqueado';desc='Expanda sua fazenda para liberar este espaço.';ico='🔒'}else if(p.state==='grass'){title='Terreno livre';desc='Prepare a terra com a enxada para começar a plantar.';ico='🌿';action='<button class="primary" data-action="hoe">Preparar terreno</button>'}else if(p.state==='tilled'){title='Canteiro preparado';desc='A terra está pronta. Escolha uma semente para plantar.';ico='🟫';action='<button class="primary" data-action="plant">Escolher semente</button>'}else{let c=CROPS[p.crop],ready=isReady(p);title=c.name;desc=ready?'Sua plantação está madura e pronta para colher.':`Crescendo · faltam ${format(remaining(p))}`;ico=c.emoji;action=ready?'<button class="primary" data-action="harvest">Colher agora</button>':`<span class="badge">🌱 Em crescimento</span>`}return `<div class="selected-panel"><div class="selected-art">${ico}</div><div class="selected-info"><strong>${title}</strong><span>${desc}</span></div>${action}</div>`}
function farmPage(){return `<div class="sectionhead"><h2>🏡 Sua propriedade</h2><span class="subtle">${unlockedCount()} espaços liberados</span></div><div class="card farm-card"><div class="farm-sky"><span>☀️ Um lindo dia no campo</span><span>🌤️ 24°C</span></div><div class="farm-wrap" id="mapWrap">${drawMap()}</div><div class="farm-foot"><span>Toque no terreno para interagir</span><b>${readyCount()} prontas para colher</b></div></div><div class="toolrow">${[['select','👆','Selecionar'],['hoe','⛏️','Enxada'],['plant','🌱','Plantar'],['harvest','🌾','Colher'],['water','💧','Regar']].map(([id,ico,label])=>`<button class="tool ${S.tool===id?'active':''}" data-tool="${id}"><span class="ico">${ico}</span>${label}</button>`).join('')}</div><div class="hint" id="toolHint">${toolHint()}</div>${selectedDetail()}<div class="stats"><div class="stat"><div class="sico">🌱</div><strong>${Object.values(S.seeds).reduce((a,b)=>a+b,0)}</strong><span>Sementes</span></div><div class="stat"><div class="sico">🌾</div><strong>${S.stats.harvested}</strong><span>Colheitas</span></div><div class="stat"><div class="sico">🐄</div><strong>${S.animals.length}</strong><span>Animais</span></div><div class="stat"><div class="sico">🚜</div><strong>${S.machine?'1':'0'}</strong><span>Máquinas</span></div></div><div class="card"><div class="sectionhead"><h2>🐾 Seus animais</h2><button class="secondary" data-nav="shop" data-cat="animals">Visitar loja</button></div>${S.animals.length?S.animals.map((a,i)=>{let cfg=ANIMALS[a.type],ready=Date.now()>=a.nextAt;return `<div class="crop-card"><div class="crop-art">${cfg.emoji}</div><div class="crop-meta"><strong>${cfg.name} #${i+1}</strong><small>${ready?`Produziu ${cfg.product.toLowerCase()}!`:`Próxima produção em ${format(a.nextAt-Date.now())}`}</small></div><button class="crop-action" data-collect-animal="${i}" ${ready?'':'disabled'}>Coletar</button></div>`}).join(''):'<div class="empty"><div class="big">🐔</div>Ainda não há animais. Compre sua primeira galinha na loja.</div>'}</div>`}
function cropCard(id){let c=CROPS[id],locked=S.level<c.level,owned=S.seeds[id]||0;return `<div class="crop-card"><div class="crop-art">${c.emoji}</div><div class="crop-meta"><strong>${c.name}</strong><small>⏱ ${format(c.time)} · 🪙 ${c.price} · Venda ${c.sell} moedas<br>⭐ ${c.xp} XP por colheita · ${owned} sementes</small></div><button class="crop-action" data-buy-seed="${id}" ${locked||S.coins<c.price?'disabled':''}>${locked?'Nível '+c.level:'Comprar'}</button></div>`}
function animalCard(id){let a=ANIMALS[id],locked=S.level<a.level;return `<div class="crop-card"><div class="crop-art">${a.emoji}</div><div class="crop-meta"><strong>${a.name}</strong><small>Produz ${a.product.toLowerCase()} a cada ${format(a.time)} · Venda ${a.sell} moedas<br>⭐ Desbloqueia no nível ${a.level}</small></div><button class="crop-action" data-buy-animal="${id}" ${locked||S.coins<a.price?'disabled':''}>${locked?'Nível '+a.level:'🪙 '+a.price}</button></div>`}
function shopPage(){let cat=S.shopCategory;return `<div class="page-title">🏪 Loja da fazenda</div><div class="page-sub">Tudo o que você precisa para fazer sua propriedade crescer.</div><div class="segmented"><button class="segment ${cat==='seeds'?'active':''}" data-shopcat="seeds">🌱 Sementes</button><button class="segment ${cat==='animals'?'active':''}" data-shopcat="animals">🐄 Animais</button><button class="segment ${cat==='machines'?'active':''}" data-shopcat="machines">🚜 Máquinas</button><button class="segment ${cat==='decor'?'active':''}" data-shopcat="decor">🌳 Decoração</button></div><div class="card"><div class="sectionhead"><h2>${({seeds:'Pacotes de sementes',animals:'Animais de criação',machines:'Equipamentos agrícolas',decor:'Objetos para decorar'})[cat]}</h2><span class="subtle">Saldo: 🪙 ${S.coins}</span></div><div class="crop-list">${cat==='seeds'?Object.keys(CROPS).map(cropCard).join(''):cat==='animals'?Object.keys(ANIMALS).map(animalCard).join(''):cat==='machines'?machineShop():decorShop()}</div></div>`}
function machineShop(){return `<div class="crop-card"><div class="crop-art">🚜</div><div class="crop-meta"><strong>Trator compacto</strong><small>Permite arar até 3 terrenos próximos em uma operação. Nível 3.</small></div><button class="crop-action" data-buy-machine ${S.machine||S.level<3||S.coins<1200?'disabled':''}>${S.machine?'Comprado':S.level<3?'Nível 3':'🪙 1.200'}</button></div>`}
function decorShop(){return `<div class="crop-card"><div class="crop-art">🌳</div><div class="crop-meta"><strong>Árvore ornamental</strong><small>Decore sua propriedade. Não ocupa canteiros de cultivo.</small></div><button class="crop-action" data-buy-decor="tree" ${S.coins<90?'disabled':''}>🪙 90</button></div><div class="crop-card"><div class="crop-art">🌷</div><div class="crop-meta"><strong>Canteiro de flores</strong><small>Um toque de cor para sua fazenda.</small></div><button class="crop-action" data-buy-decor="flowers" ${S.coins<65?'disabled':''}>🪙 65</button></div>`}
function storagePage(){let entries=Object.entries(S.produce).filter(([k,n])=>n>0),animalEntries=Object.entries(S.animalProduce||{}).filter(([k,n])=>n>0),animalValues={Ovos:35,Leite:85,Lã:105},animalIcons={Ovos:'🥚',Leite:'🥛',Lã:'🧶'};return `<div class="page-title">📦 Depósito</div><div class="page-sub">Tudo o que você colheu fica guardado aqui até decidir vender.</div><div class="card"><div class="sectionhead"><h2>Produtos armazenados</h2><span class="subtle">${entries.reduce((a,[k,n])=>a+n,0)+animalEntries.reduce((a,[k,n])=>a+n,0)} unidades</span></div>${entries.length||animalEntries.length?`<div class="crop-list">${entries.map(([id,n])=>{let c=CROPS[id];return `<div class="crop-card"><div class="crop-art">${c.emoji}</div><div class="crop-meta"><strong>${c.name}</strong><small>${n} unidades · ${c.sell} moedas cada</small></div><button class="crop-action" data-sell="${id}">Vender tudo</button></div>`}).join('')}${animalEntries.map(([id,n])=>`<div class="crop-card"><div class="crop-art">${animalIcons[id]||'📦'}</div><div class="crop-meta"><strong>${id}</strong><small>${n} unidades · ${animalValues[id]||0} moedas cada</small></div><button class="crop-action" data-sell-animal="${id}">Vender tudo</button></div>`).join('')}</div><button class="primary" style="width:100%;margin-top:12px" data-sell-all>Vender toda a produção · 🪙 ${entries.reduce((a,[id,n])=>a+n*CROPS[id].sell,0)+animalEntries.reduce((a,[id,n])=>a+n*(animalValues[id]||0),0)}</button>`:'<div class="empty"><div class="big">🧺</div>Seu depósito está vazio.<br>Colha uma plantação ou recolha os produtos dos animais.</div>'}</div><div class="card"><div class="sectionhead"><h2>🪙 Feira da fazenda</h2><span class="badge">Venda direta</span></div><p class="subtle" style="line-height:1.5">Os produtos podem ser vendidos quando você quiser. A versão clássica vendia a colheita automaticamente; aqui você também pode guardar e escolher a hora de vender.</p></div>`}
const MISSIONS=[{id:'plant3',title:'Mãos à obra',desc:'Plante 3 sementes.',goal:3,stat:'planted',reward:80,xp:15,icon:'🌱'},{id:'harvest3',title:'Primeira colheita',desc:'Colha 3 plantações.',goal:3,stat:'harvested',reward:110,xp:25,icon:'🌾'},{id:'buy1',title:'Abastecendo a fazenda',desc:'Compre 1 pacote de sementes.',goal:1,stat:'bought',reward:45,xp:10,icon:'🛍️'},{id:'animal1',title:'Novos moradores',desc:'Tenha seu primeiro animal.',goal:1,stat:'animals',reward:150,xp:30,icon:'🐔'}];
function missionsPage(){return `<div class="page-title">📜 Missões e conquistas</div><div class="page-sub">Pequenas tarefas para ajudar sua fazenda a prosperar.</div><div class="card"><div class="sectionhead"><h2>Missões da fazenda</h2><span class="badge">${S.claimed.length}/${MISSIONS.length} concluídas</span></div><div class="crop-list">${MISSIONS.map(m=>{let n=Math.min(S.stats[m.stat],m.goal),done=n>=m.goal,claimed=S.claimed.includes(m.id);return `<div class="mission"><div class="mission-top"><span>${m.icon} ${m.title}</span><span class="badge ${claimed?'done':''}">${claimed?'Resgatada':done?'Concluída':'Em andamento'}</span></div><small>${m.desc}</small><div class="progress"><i style="width:${n/m.goal*100}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><small>${n}/${m.goal} · 🪙 ${m.reward} · ⭐ ${m.xp} XP</small><button class="crop-action" data-claim="${m.id}" ${!done||claimed?'disabled':''}>${claimed?'OK':'Resgatar'}</button></div></div>`}).join('')}</div></div><div class="card"><div class="sectionhead"><h2>📈 Seu progresso</h2></div><div class="stats" style="margin:0"><div class="stat"><div class="sico">🌱</div><strong>${S.stats.planted}</strong><span>Sementes plantadas</span></div><div class="stat"><div class="sico">🌾</div><strong>${S.stats.harvested}</strong><span>Colheitas</span></div><div class="stat"><div class="sico">🛍️</div><strong>${S.stats.bought}</strong><span>Compras</span></div><div class="stat"><div class="sico">🐾</div><strong>${S.stats.animals}</strong><span>Animais</span></div></div></div>`}
function morePage(){return `<div class="page-title">☰ Mais opções</div><div class="page-sub">Administre sua propriedade e personalize sua experiência.</div><div class="card"><div class="sectionhead"><h2>🗺️ Expansão da fazenda</h2><span class="badge">${S.expanded?'7 × 7':'5 × 5'}</span></div><p class="subtle" style="line-height:1.5">A fazenda começa com 25 espaços liberados. A expansão abre 24 novos espaços ao redor do terreno atual.</p><div class="crop-card"><div class="crop-art">🏞️</div><div class="crop-meta"><strong>Terreno ampliado</strong><small>${S.expanded?'Você já liberou toda a primeira expansão.':'Libera 24 quadrados · custo: 800 moedas'}</small></div><button class="crop-action" data-expand ${S.expanded||S.coins<800?'disabled':''}>${S.expanded?'Liberado':'🪙 800'}</button></div></div><div class="card"><div class="sectionhead"><h2>⚙️ Preferências</h2></div><div class="settings-row"><div><b>Venda rápida</b><div class="subtle">Ao colher, vende automaticamente a produção.</div></div><input class="toggle" type="checkbox" id="autoSell" ${S.autoSell?'checked':''}></div><div class="settings-row"><div><b>Modo demonstração</b><div class="subtle">Acelera o crescimento para testar o jogo.</div></div><input class="toggle" type="checkbox" id="demo" ${S.demo?'checked':''}></div><div class="settings-row"><div><b>Nome da fazenda</b><div class="subtle">Personalize o nome da sua propriedade.</div></div><button class="secondary" data-rename>Alterar</button></div><div class="settings-row"><div><b>Exportar progresso</b><div class="subtle">Baixe uma cópia do seu salvamento.</div></div><button class="secondary" data-export>Exportar</button></div><div class="settings-row"><div><b>Importar progresso</b><div class="subtle">Restaurar um arquivo salvo anteriormente.</div></div><button class="secondary" data-import>Importar</button></div><div class="settings-row"><div><b>Instalar aplicativo</b><div class="subtle">Adicione Minha Fazenda à tela inicial.</div></div><button class="secondary" data-install>Instalar</button></div></div><div class="card"><div class="sectionhead"><h2>ℹ️ Sobre</h2></div><p class="subtle" style="line-height:1.6">Minha Fazenda é um jogo casual independente, inspirado em jogos sociais de fazenda. Seu progresso fica salvo neste aparelho. A versão PWA pode funcionar offline depois da primeira abertura.</p><button class="danger" data-reset>Reiniciar a fazenda</button></div>`}
function render(){statsHeader();let page=S.page||'farm';$('main').innerHTML=({farm:farmPage,shop:shopPage,storage:storagePage,missions:missionsPage,more:morePage})[page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));bind();}
function setPage(p){S.page=p;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function bindPlotEvents(){document.querySelectorAll('[data-plot]').forEach(el=>el.addEventListener('click',()=>plotTap(+el.dataset.plot)))}
function bind(){bindPlotEvents();document.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>{S.tool=el.dataset.tool;render()});document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{if(el.dataset.cat)S.shopCategory=el.dataset.cat;setPage(el.dataset.nav)});document.querySelectorAll('[data-buy-seed]').forEach(el=>el.onclick=()=>buySeed(el.dataset.buySeed));document.querySelectorAll('[data-shopcat]').forEach(el=>el.onclick=()=>{S.shopCategory=el.dataset.shopcat;render()});document.querySelectorAll('[data-buy-animal]').forEach(el=>el.onclick=()=>buyAnimal(el.dataset.buyAnimal));document.querySelectorAll('[data-buy-machine]').forEach(el=>el.onclick=buyMachine);document.querySelectorAll('[data-buy-decor]').forEach(el=>el.onclick=()=>buyDecor(el.dataset.buyDecor));document.querySelectorAll('[data-sell]').forEach(el=>el.onclick=()=>sell(el.dataset.sell));document.querySelectorAll('[data-sell-animal]').forEach(el=>el.onclick=()=>sellAnimal(el.dataset.sellAnimal));document.querySelectorAll('[data-sell-all]').forEach(el=>el.onclick=sellAll);document.querySelectorAll('[data-collect-animal]').forEach(el=>el.onclick=()=>collectAnimal(+el.dataset.collectAnimal));document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let p=S.plots[S.selectedPlot];if(el.dataset.action==='hoe')hoe(S.selectedPlot);if(el.dataset.action==='plant'){S.page='shop';S.shopCategory='seeds';render()}if(el.dataset.action==='harvest')harvest(S.selectedPlot)});document.querySelectorAll('[data-claim]').forEach(el=>el.onclick=()=>claim(el.dataset.claim));document.querySelectorAll('[data-expand]').forEach(el=>el.onclick=expand);document.querySelectorAll('[data-rename]').forEach(el=>el.onclick=renameFarm);document.querySelectorAll('[data-export]').forEach(el=>el.onclick=exportSave);document.querySelectorAll('[data-import]').forEach(el=>el.onclick=importSave);document.querySelectorAll('[data-install]').forEach(el=>el.onclick=installApp);document.querySelectorAll('[data-reset]').forEach(el=>el.onclick=resetGame);let a=$('autoSell'),d=$('demo');if(a)a.onchange=()=>{S.autoSell=a.checked;save()};if(d)d.onchange=()=>{S.demo=d.checked;save();render();toast(S.demo?'Modo de demonstração ativado.':'Tempos reais ativados.')};document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>setPage(el.dataset.page));}
function plotTap(i){let p=S.plots[i];S.selectedPlot=i;if(!p.unlocked){toast('Este espaço ainda está bloqueado.');render();return}if(S.tool==='hoe'){hoe(i);return}if(S.tool==='plant'){plant(i);return}if(S.tool==='harvest'){harvest(i);return}if(S.tool==='water'){water(i);return}render()}
function hoe(i){let p=S.plots[i];if(!p.unlocked||p.state!=='grass'){toast('Escolha um terreno livre.');return}let targets=[i];if(S.machine){let x=i%7,y=Math.floor(i/7);[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{let nx=x+dx,ny=y+dy,j=ny*7+nx;if(nx>=0&&nx<7&&ny>=0&&ny<7&&S.plots[j].unlocked&&S.plots[j].state==='grass'&&targets.length<3)targets.push(j);return targets.length===3})}targets.forEach(j=>{S.plots[j].state='tilled'});S.selectedPlot=i;xp(targets.length);save();render();toast(targets.length>1?`Trator preparou ${targets.length} terrenos!`:'Terra preparada! Agora escolha uma semente.')}
function plant(i){let p=S.plots[i],id=S.selectedCrop;if(!p.unlocked||p.state!=='tilled'){toast('Primeiro prepare um terreno vazio com a enxada.');return}if((S.seeds[id]||0)<1){toast('Você não tem essa semente. Visite a loja.');setPage('shop');return}S.seeds[id]--;p.state='growing';p.crop=id;p.plantedAt=Date.now();p.watered=false;S.stats.planted++;S.selectedPlot=i;xp(2);save();render();toast(`${CROPS[id].name} plantado! Volte quando amadurecer.`)}
function harvest(i){let p=S.plots[i];if(!isReady(p)){toast(p.state==='growing'?'Ainda está crescendo.':'Não há plantação pronta aqui.');return}let id=p.crop,c=CROPS[id];if(S.autoSell){S.coins+=c.sell*c.qty;toast(`${c.name} vendido automaticamente: +${c.sell*c.qty} moedas.`)}else{S.produce[id]=(S.produce[id]||0)+c.qty;toast(`Colheita guardada! +${c.qty} ${c.name.toLowerCase()}.`)}p.state='tilled';p.crop=null;p.plantedAt=0;p.watered=false;S.stats.harvested++;xp(c.xp);S.selectedPlot=i;save();render()}
function water(i){let p=S.plots[i];if(p.state!=='growing'||isReady(p)){toast('Escolha uma plantação em crescimento.');return}if(p.watered){toast('Este canteiro já foi regado.');return}p.watered=true;p.plantedAt-=CROPS[p.crop].time*.08;save();render();toast('💧 Plantação regada! Crescimento adiantado em 8%.')}
function buySeed(id){let c=CROPS[id];if(S.level<c.level||S.coins<c.price){toast(S.level<c.level?'Você precisa subir de nível.':'Moedas insuficientes.');return}S.coins-=c.price;S.seeds[id]=(S.seeds[id]||0)+1;S.selectedCrop=id;S.stats.bought++;save();render();toast(`${c.name} comprado. Vá à fazenda e use a ferramenta Plantar.`)}
function buyAnimal(id){let a=ANIMALS[id];if(S.level<a.level||S.coins<a.price){toast(S.level<a.level?'Você precisa subir de nível.':'Moedas insuficientes.');return}if(S.animals.length>=8){toast('O espaço para animais está cheio.');return}S.coins-=a.price;S.animals.push({type:id,nextAt:Date.now()+a.time});S.stats.animals=S.animals.length;S.stats.bought++;xp(5);save();render();toast(`${a.name} chegou à fazenda!`)}
function collectAnimal(i){let animal=S.animals[i],a=ANIMALS[animal.type];if(!animal||Date.now()<animal.nextAt)return;S.animalProduce[a.product]=(S.animalProduce[a.product]||0)+1;animal.nextAt=Date.now()+a.time;save();render();toast(`${a.product} coletado! Está guardado no depósito.`)}
function buyMachine(){if(S.machine||S.coins<1200||S.level<3)return;S.coins-=1200;S.machine=true;save();render();toast('🚜 Trator comprado! Enxada agora alcança terrenos vizinhos.')}
function buyDecor(type){let price=type==='tree'?90:65;if(S.coins<price)return;S.coins-=price;S.decor.push(type);save();render();toast('Decoração adicionada ao seu inventário. Em breve você poderá posicioná-la no mapa.')}
function sell(id){let n=S.produce[id]||0;if(!n)return;S.coins+=n*CROPS[id].sell;delete S.produce[id];save();render();toast(`Venda concluída: +${n*CROPS[id].sell} moedas.`)}
function sellAnimal(id){let values={Ovos:35,Leite:85,Lã:105},n=(S.animalProduce||{})[id]||0;if(!n)return;let total=n*(values[id]||0);S.coins+=total;delete S.animalProduce[id];save();render();toast(`${id} vendido: +${total} moedas.`)}
function sellAll(){let total=0;Object.entries(S.produce).forEach(([id,n])=>total+=n*CROPS[id].sell);let values={Ovos:35,Leite:85,Lã:105};Object.entries(S.animalProduce||{}).forEach(([id,n])=>total+=n*(values[id]||0));if(!total)return;S.coins+=total;S.produce={};S.animalProduce={};save();render();toast(`Tudo vendido! Você recebeu ${total} moedas.`)}
function claim(id){let m=MISSIONS.find(x=>x.id===id);if(!m||S.claimed.includes(id)||S.stats[m.stat]<m.goal)return;S.claimed.push(id);S.coins+=m.reward;xp(m.xp);save();render();toast(`Missão concluída! +${m.reward} moedas.`)}
function expand(){if(S.expanded||S.coins<800)return;S.coins-=800;S.expanded=true;S.plots.forEach((p,i)=>{let x=i%7,y=Math.floor(i/7);if(!p.unlocked&&(x===0||x===6||y===0||y===6)){p.unlocked=true;p.state='grass'}});xp(25);save();render();toast('🌳 Sua propriedade cresceu! 24 novos espaços liberados.')}
function renameFarm(){let name=prompt('Qual será o nome da sua fazenda?',S.farmName);if(name&&name.trim()){S.farmName=name.trim().slice(0,32);save();render()}}
function exportSave(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minha-fazenda-salvamento.json';a.click();URL.revokeObjectURL(url);toast('Arquivo de salvamento exportado.')}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let n=JSON.parse(r.result);if(!Array.isArray(n.plots)||!n.seeds||typeof n.coins!=='number')throw Error();S=Object.assign(newState(),n);save();render();toast('Progresso restaurado!')}catch(e){toast('Arquivo de salvamento inválido.')}};r.readAsText(f)};input.click()}
function resetGame(){if(!confirm('Reiniciar a fazenda? Todo o progresso salvo neste aparelho será apagado.'))return;S=newState();save();render();toast('Uma nova fazenda está esperando por você!')}
function installApp(){if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt.userChoice.then(()=>window.deferredPrompt=null)}else toast('No Android: abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.')}
function tick(){let count=readyCount();if(S.page==='farm'){let wrap=$('mapWrap');if(wrap){wrap.innerHTML=drawMap();bindPlotEvents()}let foot=document.querySelector('.farm-foot b');if(foot)foot.textContent=count+' prontas para colher';if(count>lastReadyCount)toast('🌾 Sua plantação amadureceu! Hora de colher.')}else{let badge=document.querySelector('[data-page="farm"]');if(badge)badge.title=count+' plantações prontas'}lastReadyCount=count;statsHeader()}
document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>setPage(el.dataset.page));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredPrompt=e});
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
if('Notification'in window&&Notification.permission==='granted'){/* notificações futuras dependem do suporte do sistema */}
render();lastReadyCount=readyCount();setInterval(tick,1000);save();window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){lastReadyCount=readyCount();render();}});
})();
</script>
</body>
</html>
